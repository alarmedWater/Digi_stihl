<!-- Gesamter Seitencontainer -->
<div class="kapazitaetsabweichung-container">

  <!-- Filterfeld zur Suche nach Namen oder Bemerkung -->
  <div class="filter-container">
    <mat-form-field appearance="outline">
      <mat-label>Filter</mat-label>
      <!-- Eingabe mit Two-Way-Binding an 'filterText' + Aufruf von applyFilter() -->
      <input matInput [(ngModel)]="filterText" (input)="applyFilter()" placeholder="Name oder Grund..." />
    </mat-form-field>
  </div>

  <!-- Tabelle der gefilterten Abweichungen -->
  <table mat-table [dataSource]="gefilterteAbweichungen" class="abweichung-tabelle">

    <!-- Spalte für Mitarbeitenden-Namen -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let a"> {{ a.name }} </td>
    </ng-container>

    <!-- Zeitraum (Startdatum – Enddatum) -->
    <ng-container matColumnDef="zeitraum">
      <th mat-header-cell *matHeaderCellDef> Zeitraum </th>
      <td mat-cell *matCellDef="let a">
        {{ a.startdatum | date }} – {{ a.enddatum | date }}
      </td>
    </ng-container>

    <!-- Neue Kapazität mit farblicher Hervorhebung -->
    <ng-container matColumnDef="kapazitaet">
      <th mat-header-cell *matHeaderCellDef> Neue Kapazität </th>
      <td mat-cell *matCellDef="let a"
          [ngClass]="{ 'negativ': a.neueKapazitaet < 0, 'positiv': a.neueKapazitaet > 0 }">
        {{ a.neueKapazitaet }}
      </td>
    </ng-container>

    <!-- Grund der Abweichung -->
    <ng-container matColumnDef="bemerkung">
      <th mat-header-cell *matHeaderCellDef> Grund </th>
      <td mat-cell *matCellDef="let a"> {{ a.bemerkung }} </td>
    </ng-container>

    <!-- Aktionsspalte mit Buttons -->
    <ng-container matColumnDef="aktion">
      <th mat-header-cell *matHeaderCellDef> Aktion </th>
      <td mat-cell *matCellDef="let a">
        <button mat-button color="primary" (click)="bearbeiten(a)">Bearbeiten</button>
        <button mat-button color="warn" (click)="loeschen(a)">Löschen</button>
      </td>
    </ng-container>

    <!-- Tabellenkopf & Datenzeilen -->
    <tr mat-header-row *matHeaderRowDef="['name', 'zeitraum', 'kapazitaet', 'bemerkung', 'aktion']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['name', 'zeitraum', 'kapazitaet', 'bemerkung', 'aktion']"></tr>
  </table>

  <!-- Export- und Erfassungsaktionen -->
  <div class="aktionen">
    <button mat-raised-button color="accent" (click)="neueAbweichung()">Neue Abweichung erfassen</button>
    <button mat-raised-button (click)="exportieren()">Exportieren (CSV)</button>
  </div>

</div>
