<div>
      <h2>Mitarbeiter bearbeiten</h2>
      <!-- Eingabefeld für den Filter zur Suche innerhalb der Mitarbeiterliste -->
      <mat-form-field appearance="outline">
        <mat-label>Filter</mat-label>
        <input matInput [(ngModel)]="filterWert" (input)="applyFilter()" placeholder="Suchen..." />
      </mat-form-field>
    
      <!-- Tabelle zur Anzeige der gefilterten Mitarbeiterliste -->
      <table mat-table [dataSource]="gefilterteListe">
    
        <!-- Spalte für den Vornamen der Mitarbeiter -->
        <ng-container matColumnDef="vorname">
          <th mat-header-cell *matHeaderCellDef> Vorname </th>
          <td mat-cell *matCellDef="let element"> {{element.vorname}} </td>
        </ng-container>
    
        <!-- Spalte für den Nachnamen der Mitarbeiter -->
        <ng-container matColumnDef="nachname">
          <th mat-header-cell *matHeaderCellDef> Nachname </th>
          <td mat-cell *matCellDef="let element"> {{element.nachname}} </td>
        </ng-container>
    
        <!-- Spalte für die Kostenstelle der Mitarbeiter -->
        <ng-container matColumnDef="kostenstelle">
          <th mat-header-cell *matHeaderCellDef> Kostenstelle </th>
          <td mat-cell *matCellDef="let element"> {{element.kostenstelle}} </td>
        </ng-container>
    
        <!-- Spalte für den Bereich der Mitarbeiter -->
        <ng-container matColumnDef="bereich">
          <th mat-header-cell *matHeaderCellDef> Bereich </th>
          <td mat-cell *matCellDef="let element"> {{element.bereich}} </td>
        </ng-container>
    
        <!-- Spalte für das Eintrittsdatum der Mitarbeiter -->
        <ng-container matColumnDef="eintritt">
          <th mat-header-cell *matHeaderCellDef> Eintritt </th>
          <td mat-cell *matCellDef="let element"> {{element.eintritt | date}} </td>
        </ng-container>
    
        <!-- Spalte für Aktionen, z.B. zum Bearbeiten der Mitarbeiterdaten -->
        <ng-container matColumnDef="aktion">
          <th mat-header-cell *matHeaderCellDef> Aktionen </th>
          <td mat-cell *matCellDef="let element">
            <button mat-button (click)="bearbeiten(element)">Bearbeiten</button>
          </td>
        </ng-container>
    
        <!-- Definition der Kopfzeile der Tabelle mit den angegebenen Spalten -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <!-- Definition der Datenzeilen der Tabelle -->
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
