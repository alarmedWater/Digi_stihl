<div class="atz-wrapper">
  <h2>ATZ</h2>

  <input
    type="text"
    [(ngModel)]="suchbegriff"
    placeholder="Suchen nach Name, Abteilung oder Datum"
    class="suchfeld"
  />

  <table class="atz-tabelle">
    <thead>
      <tr>
        <th>Name</th>
        <th>Abteilung</th>
        <th>Austrittsdatum</th>
        <th>Bemerkung</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let m of gefilterteMitarbeiter">
        <td>{{ m.name }}</td>
        <td>{{ m.abteilung }}</td>
        <td>{{ m.austrittsdatum }}</td>
        <td>{{ m.bemerkung }}</td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="gefilterteMitarbeiter.length === 0" class="kein-treffer">
    Keine passenden ATZ-Mitarbeitenden gefunden.
  </div>
</div>
