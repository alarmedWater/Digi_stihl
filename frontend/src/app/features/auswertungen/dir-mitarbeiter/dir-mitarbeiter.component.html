<div class="auswertung-container">
      <h2>Kapazitätsauswertung – Direkte Mitarbeitende</h2>
    
      <!-- Filter nach Abteilung -->
      <mat-form-field appearance="outline" class="filter-dropdown">
        <mat-label>Abteilung wählen</mat-label>
        <mat-select [(ngModel)]="gewaehlteAbteilung" (selectionChange)="filterNachAbteilung()">
          <mat-option value="">Alle Abteilungen</mat-option>
          <mat-option *ngFor="let abt of abteilungen" [value]="abt">{{ abt }}</mat-option>
        </mat-select>
      </mat-form-field>
    
      <!-- Tabelle im Scroll-Container -->
      <div class="table-scroll-container">
        <table mat-table [dataSource]="gefilterteDaten" class="fte-tabelle">
    
          <!-- Name-Spalte -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Name </th>
            <td mat-cell *matCellDef="let element">{{ element.name }}</td>
          </ng-container>
    
          <!-- Abteilung-Spalte -->
          <ng-container matColumnDef="abteilung">
            <th mat-header-cell *matHeaderCellDef> Abteilung </th>
            <td mat-cell *matCellDef="let element">{{ element.abteilung }}</td>
          </ng-container>
    
          <!-- Dynamisch erzeugte Monatsspalten -->
          <ng-container *ngFor="let monat of monateLabels; let i = index" [matColumnDef]="'monat' + (i + 1)">
            <th mat-header-cell *matHeaderCellDef> {{ monat }} </th>
            <td mat-cell *matCellDef="let element"
                [ngClass]="{
                  'fte-positiv': element['monat' + (i + 1)] > 0,
                  'fte-negativ': element['monat' + (i + 1)] < 0
                }">
                {{ element.fte[i] }}
            </td>
          </ng-container>
    
          <!-- Kopfzeile -->
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <!-- Datenzeilen -->
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>          
        </table>
      </div>
    </div>
