<div class="befristung-container">
  <h2>Befristete Mitarbeitende</h2>

  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Suche nach Name, Abteilung, Beschäftigungsart…</mat-label>
    <input matInput [(ngModel)]="suchbegriff" placeholder="Suchbegriff" />
  </mat-form-field>

  <table class="app-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Abteilung</th>
        <th>Beschäftigungsart</th>
        <th>Befristet bis</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let m of gefilterteBefristete">
        <td>{{ m.name }}</td>
        <td>{{ m.abteilungsname }}</td>
        <td>{{ m.beschaeftigungsart }}</td>
        <td>{{ m.befristetBis }}</td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="gefilterteBefristete.length === 0" class="no-data">
    Keine Einträge gefunden.
  </p>
</div>
