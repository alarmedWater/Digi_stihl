<!-- src/app/features/austritte/austritte.component.html -->

<h2>Austritte</h2>

<!-- Suchfeld -->
<input
  type="text"
  [(ngModel)]="suchbegriff"
  placeholder="Suche nach Name oder Datum"
/>

<!-- Tabelle mit gefilterten Daten -->
<table class="app-table by-austritte">
  <thead>
    <tr>
      <th>Name</th>
      <th>Abteilung</th>
      <th>Austrittsdatum</th>
      <th>Austrittsart</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let mitarbeiter of gefilterteAustritte">
      <td>{{ mitarbeiter.name }}</td>
      <td>{{ mitarbeiter.abteilung }}</td>
      <td>{{ mitarbeiter.austrittsdatum }}</td>
      <td>{{ mitarbeiter.austrittsart }}</td>
    </tr>
  </tbody>
</table>
