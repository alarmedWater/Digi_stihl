
<h2 mat-dialog-title>Kapazitätsabweichung</h2>

<form [formGroup]="abweichungForm" mat-dialog-content>

  <!-- Mitarbeiter-Auswahl -->
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Mitarbeiter</mat-label>
    <mat-select formControlName="employeeId" required>
      <mat-option
        *ngFor="let m of mitarbeiterListe"
        [value]="m.employeeId"
      >
        {{ m.vorname }} {{ m.name }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <!-- Startdatum -->
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Startdatum</mat-label>
    <input
      matInput
      [matDatepicker]="pickerStart"
      formControlName="startdatum"
      required
    />
    <mat-datepicker-toggle matSuffix [for]="pickerStart"></mat-datepicker-toggle>
    <mat-datepicker #pickerStart></mat-datepicker>
  </mat-form-field>

  <!-- Enddatum -->
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Enddatum</mat-label>
    <input
      matInput
      [matDatepicker]="pickerEnd"
      formControlName="enddatum"
      required
    />
    <mat-datepicker-toggle matSuffix [for]="pickerEnd"></mat-datepicker-toggle>
    <mat-datepicker #pickerEnd></mat-datepicker>
  </mat-form-field>

  <!-- Neue Kapazität -->
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Neue Kapazität (FTE)</mat-label>
    <input
      matInput
      type="number"
      step="0.1"
      formControlName="neueKapazitaet"
      required
    />
  </mat-form-field>

  <!-- Bemerkung -->
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Bemerkung</mat-label>
    <textarea
      matInput
      formControlName="bemerkung"
      rows="3"
    ></textarea>
  </mat-form-field>

</form>

<mat-dialog-actions align="end">
  <button mat-button (click)="onAbbrechen()">Abbrechen</button>
  <button
    mat-flat-button
    color="primary"
    (click)="onSpeichern()"
    [disabled]="abweichungForm.invalid"
  >
    Speichern
  </button>
</mat-dialog-actions>
