<h2 mat-dialog-title>Neue Abweichung anlegen</h2>

<form [formGroup]="form" mat-dialog-content>

  <!-- Namenssuche -->
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Nach Name filtern</mat-label>
    <input
      matInput
      formControlName="search"
      placeholder="Vor- oder Nachname eingeben"
      autocomplete="off"
    />
  </mat-form-field>

  <!-- Mitarbeiter auswählen -->
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Mitarbeiter wählen</mat-label>
    <mat-select formControlName="employeeId">
      <mat-option *ngFor="let m of filteredEmployees" [value]="m.employeeId">
        {{ m.vorname }} {{ m.name }}
      </mat-option>
      <mat-option *ngIf="filteredEmployees.length === 0" disabled>
        Keine Übereinstimmungen
      </mat-option>
    </mat-select>
  </mat-form-field>

</form>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Abbrechen</button>
  <button mat-flat-button color="primary" (click)="onNext()" [disabled]="form.invalid">
    Weiter
  </button>
</mat-dialog-actions>
