<!-- Container für die Sidebar-Navigation und den Hauptinhalt der Anwendung -->
<mat-sidenav-container class="sidenav-container">

  <!-- Sidebar für die Navigation (Menü) -->
  <mat-sidenav
    mode="side"
    [(opened)]="isSidebarOpen"
    class="sidenav"
    aria-label="Seitennavigation">

    <!-- Button zum Ein- und Ausklappen der Sidebar -->
    <button
      (click)="toggleSidebar()"
      class="toggle-btn"
      [attr.aria-expanded]="isSidebarOpen"
      aria-controls="main-menu"
      aria-label="Sidebar ein- und ausklappen">
      ☰ Menü
    </button>

    <!-- Navigationsliste in der Sidebar -->
    <mat-nav-list id="main-menu" role="navigation" aria-label="Hauptmenü">
      <a mat-list-item routerLink="/mitarbeiter-anlegen" routerLinkActive="active-link" tabindex="0">
        Mitarbeiter anlegen
      </a>
      <a mat-list-item routerLink="/mitarbeiter-bearbeiten" routerLinkActive="active-link" tabindex="0">
        Mitarbeiter bearbeiten
      </a>
      <a mat-list-item routerLink="/kapazitaetsabweichung" routerLinkActive="active-link" tabindex="0">
        Kapazitätsabweichungen
      </a>
      <a mat-list-item routerLink="/kapazitaetsauswertung-dir" routerLinkActive="active-link" tabindex="0">
        Kapazitätsauswertung Direkt
      </a>
      <a mat-list-item routerLink="/kapazitaetsauswertung-indir" routerLinkActive="active-link" tabindex="0">
        Kapazitätsauswertung Indirekt
      </a>
      <a mat-list-item routerLink="/atz" routerLinkActive="active-link" tabindex="0">
        ATZ
      </a>
      <a mat-list-item routerLink="/befristung" routerLinkActive="active-link" tabindex="0">
        Befristung
      </a>
      <a mat-list-item routerLink="/austritte" routerLinkActive="active-link" tabindex="0">
        Austritte
      </a>
      <a mat-list-item routerLink="/fluktuation" routerLinkActive="active-link" tabindex="0">
        Fluktuation
      </a>
      <a mat-list-item routerLink="/personalentwicklung" routerLinkActive="active-link" tabindex="0">
        Personalentwicklung
      </a>
    </mat-nav-list>

  </mat-sidenav>

  <!-- Container für den Hauptinhalt der Anwendung -->
  <mat-sidenav-content class="main-content">

    <!-- Button zum Öffnen der Sidebar, wird nur angezeigt wenn die Sidebar geschlossen ist -->
    <button
      *ngIf="!isSidebarOpen"
      (click)="toggleSidebar()"
      class="toggle-btn"
      aria-expanded="false"
      aria-controls="main-menu"
      aria-label="Sidebar öffnen">
      ☰ Menü
    </button>

    <!-- Platzhalter für die aktiven Komponenten -->
    <router-outlet></router-outlet>

  </mat-sidenav-content>

</mat-sidenav-container>
